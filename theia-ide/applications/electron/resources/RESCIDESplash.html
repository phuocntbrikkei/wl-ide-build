<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    .logo {
      width: 96px;
      height: 96px;
      object-fit: contain;
      -webkit-user-drag: none;
    }
    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #1e293b;
    }
    .sub {
      font-size: 12px;
      color: #64748b;
    }
    .bar {
      margin-top: 6px;
      width: 160px;
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.3);
      overflow: hidden;
    }
    .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: #9f1239;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
  </style>
</head>
<body>
  <img class="logo" src="./icons/WindowIcon/512-512.png" alt="Rikkei Ide" />
  <div class="title">Rikkei Ide</div>
  <div class="sub">Đang khởi động…</div>
  <div class="bar"></div>
</body>
</html>
