<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        html,
        body {
            background-color: #ffffff;
        }

        .theia-preload {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: none;
        }

        .theia-preload::after {
            content: none;
        }

        .spinner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            gap: 16px;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #1a2b5a;
        }

        .custom-spinner img {
            width: 96px;
            height: 96px;
            animation: rescide-pulse 1.6s ease-in-out infinite;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        @keyframes rescide-pulse {
            0% { transform: scale(1.0); opacity: 1; }
            50% { transform: scale(0.92); opacity: 0.85; }
            100% { transform: scale(1.0); opacity: 1; }
        }
    </style>
</head>
